name: Automated Visual Regression QA Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      viewports:
        description: 'Viewports to test (comma-separated)'
        required: false
        default: 'desktop,tablet,mobile'
      threshold:
        description: 'Max allowed Diff Ratio (%) threshold'
        required: false
        default: '0.05'
      block_on_regression_demo:
        description: 'Block workflow (Red X) when v2.0 regression demo detects UI defects?'
        required: false
        type: boolean
        default: false

jobs:
  visual-regression-qa:
    name: Playwright Visual Regression & SSIM Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'visual-regression-tool/backend/requirements.txt'

      - name: 3. Install Backend QA & Image Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visual-regression-tool/backend/requirements.txt

      - name: 4. Install Playwright Headless Chromium & OS Fonts
        run: |
          python -m playwright install --with-deps chromium

      - name: 5. Run Core Engine Unit & Integration Verification
        run: |
          python visual-regression-tool/backend/test_engines.py

      - name: 6. Gate 1 — Zero-Diff Anti-Flakiness Verification (v1.0 vs v1.0)
        env:
          VIEWPORTS: ${{ github.event.inputs.viewports || 'desktop,tablet,mobile' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.05' }}
        run: |
          echo "Running Zero-Diff Verification (Baseline v1.0 vs Current v1.0)..."
          python cli.py \
            --mode pass \
            --reset-baseline \
            --viewports "$VIEWPORTS" \
            --threshold "$THRESHOLD" \
            --output-html ci_reports/01_zero_diff_pass_report.html \
            --output-json ci_reports/01_zero_diff_pass_report.json

      - name: 7. Gate 2 — Visual Regression Defect Detection (v1.0 Baseline vs v2.0 Regression)
        env:
          VIEWPORTS: ${{ github.event.inputs.viewports || 'desktop,tablet,mobile' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '0.05' }}
          BLOCK_ON_REGRESSION: ${{ github.event.inputs.block_on_regression_demo || 'false' }}
        run: |
          echo "Running Visual Regression Detection (Baseline v1.0 vs Mutated Current v2.0)..."
          set +e
          python cli.py \
            --mode regression \
            --reset-baseline \
            --viewports "$VIEWPORTS" \
            --threshold "$THRESHOLD" \
            --output-html ci_reports/02_regression_defect_report.html \
            --output-json ci_reports/02_regression_defect_report.json
          CLI_EXIT_CODE=$?
          set -e

          echo "CLI exited with code: $CLI_EXIT_CODE"
          if [ "$BLOCK_ON_REGRESSION" = "true" ]; then
            echo "Strict blocking mode enabled -> Propagating CLI exit code ($CLI_EXIT_CODE)"
            exit $CLI_EXIT_CODE
          fi

          if [ "$CLI_EXIT_CODE" -ne 1 ]; then
            echo "ERROR: Expected CLI Gatekeeper to return Exit Code 1 on v2.0 UI regression, but got $CLI_EXIT_CODE"
            exit 1
          fi
          echo "Verified: CLI Gatekeeper accurately caught v2.0 regressions and returned Exit Code 1."

      - name: 8. Upload Standalone HTML/JSON Reports & Diff Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-qa-reports
          path: |
            ci_reports/
            visual-regression-tool/backend/storage/runs/
          retention-days: 14
